# 侦听地址, ipv6 使用 [::]:9394
grpc_addr = "0.0.0.0:9394"
http_addr = "0.0.0.0:8080"
# 默认30s无上报判定下线
offline_threshold = 30

# 开启 grpc TLS, 0:关闭 1: TLS 2: mTLS
grpc_tls = 0
# 证书最终路径 ${workspace}/${tls_dir}, 包含 server.pem, server.key 文件
tls_dir = "tls"

# 管理员账号,不设置默认随机生成，用于查看 /detail, /map
jwt_secret = "" # 修改这个, 使用 openssl rand -base64 16 生成 secret
admin_user = ""
admin_pass = ""

# hosts 跟 hosts_group 两种配置模式任挑一种配置即可
# name 主机唯一标识，不可重复，alias 为展示名
# notify = false 单独禁止单台机器的告警，一般针对网络差，频繁上下线
# monthstart = 1 没启用vnstat时，表示月流量从每月哪天开始统计
# disabled = true 单机禁用
# location 支持国旗 emoji https://emojixd.com/group/flags
# 或国家缩写，如 cn us 等等，所有国家见目录 web/static/flags
# 自定义键值信息 labels = "os=centos;ndd=2022/11/25;spec=2C/4G/60G;"
# 多标签分组 tags = ["AWS", "MAILSVR", "MYSQL", "FINTECH"]
# 固定主机可用 gid 指定唯一目录；同一主机只能属于一个目录
# default 和 all 是系统保留的虚拟目录名，请勿配置为 gid
# os 标签可选，不填则使用上报数据，ndd(next due date) 下次续费时间, spec 为主机规格
# os 可用值 centos debian ubuntu alpine pi arch windows linux macos android freebsd
hosts = [
  {name = "h1", password = "p1", gid = "FINTECH", alias = "n1", location = "🏠", type = "kvm", labels = "os=freebsd;ndd=2022/11/25;spec=2C/4G/60G;", tags = ["AWS", "MYSQL"]},
  {name = "h2", password = "p2", alias = "n2", location = "🏢", type = "kvm", disabled = false},
  {name = "h3", password = "p3", alias = "n3", location = "🏡", type = "kvm", monthstart = 1},
  {name = "h4", password = "p4", alias = "n4", location = "cn", type = "kvm", notify = true, labels = "ndd=2022/11/25;spec=2C/4G/60G;"},

  # 最小化配置
  {name = "mac", password = "pp", alias = "macos"},
  {name = "pi", password = "pp", alias = "pi", labels = "os=pi"},
  {name = "win", password = "pp", alias = "windows"},
  {name = "android", password = "pp", alias = "android", labels = "os=android"},
]

# 动态注册模式，不再需要针对每一个主机做单独配置
# gid 为模板组id, 自动注册唯一标识，不可重复
# eg. ./stat_client -a "http://127.0.0.1:8080/report" -g g1 -p pp
hosts_group = [
  # 可以按国家地区或用途来做分组
  {gid = "g1", password = "pp", location = "🏠", type = "kvm", labels = "os=centos;ndd=2022/11/25;spec=2C/4G/60G;", tags = ["FINTECH"]},
  {gid = "g2", password = "pp", location = "🏢", type = "kvm", notify = true},
  # 例如不发送通知可以单独做一组
  {gid = "silent", password = "pp", location = "🏡", type = "kvm", notify = false},
]
# 动态注册模式下，无效数据清理间隔，默认 30s
# 这个设置要比较通知间隔 notify_interval 大，不然收不到告警通知
group_gc = 30

# !!! 一键部署如果没问题则不需要动，Server 会自行根据你的域名生成 server_url
# 修正一键部署，请自行替换 ssr.rs 为你的域名,
# server_url = "https://ssr.rs/report"
# stat_client 默认安装的路径
workspace = "/opt/ServerStatus"

# 不开启告警，可忽略后面配置，或者删除不需的通知方式
# 告警间隔默认为30s
notify_interval = 30

# 历史指标存储。客户端上报协议无需升级；服务端异步写入 SQLite。
# backend 预留扩展点，目前支持 sqlite，后续可增加 victoriametrics / influxdb。
[history]
enabled = true
backend = "sqlite"
path = "data/history.db"
# 兼容旧配置字段；分层聚合的具体精度由下面的 tiers 定义
compression = "latest"
# 兼容旧配置的字段；启用 tiers 后，最高精度由第一个 tier 决定。
sample_interval = 1
retention_days = 30
cleanup_interval = 3600
delete_batch_size = 1000
vacuum_after_cleanup = false
allowed_lateness = 300
maintenance_interval = 30
max_query_points = 1200

# 多精度历史：最近 15 分钟保留秒级点，低精度数据由上一层自动压缩生成。
[[history.tiers]]
resolution = "1s"
retention = "15m"

[[history.tiers]]
resolution = "1m"
retention = "30d"

[[history.tiers]]
resolution = "5m"
retention = "90d"

[[history.tiers]]
resolution = "1h"
retention = "1y"

[[history.tiers]]
resolution = "1d"
retention = "3y"

[[history.tiers]]
resolution = "1mo"
retention = "10y"

# 告警收敛。旧配置没有此段时，服务端自动使用同样的系统预设值并在启动日志中说明。
[alerts]
enabled = true
state_path = "data/alerts.db"
log_suppressed = true
log_delivery = true
offline_log = true

[alerts.disk_usage]
enabled = true
threshold = 80.0
recover_threshold = 75.0

[alerts.memory_usage]
enabled = true
threshold = 80.0
recover_threshold = 75.0

# 一个收敛规则可以绑定多个告警类型；当前内置磁盘和内存占用告警。
[[alerts.convergence_rules]]
id = "resource-default"
alert_types = ["disk_usage_high", "memory_usage_high"]

[[alerts.convergence_rules.windows]]
max_notifications = 3
interval = "5m"

[[alerts.convergence_rules.windows]]
max_notifications = 3
interval = "10m"

[[alerts.convergence_rules.windows]]
interval = "60m"

# https://core.telegram.org/bots/api
# https://jinja.palletsprojects.com/en/3.0.x/templates/#if
[tgbot]
# 开关 true 打开
enabled = false
bot_token = "<tg bot token>"
chat_id = "<chat id>"
# host 可用字段见 payload.rs 文件 HostStat 结构, {{host.xxx}} 为占位变量
# 例如 host.name 可替换为 host.alias，大家根据自己的喜好来编写通知消息
# {{ip_info.query}} 主机 ip, {{sys_info.host_name}} 主机 hostname，见 server_status.proto
title = "❗<b>Server Status</b>"
online_tpl =  "{{config.title}} \n😆 {{host.location}} {{host.name}} 主机恢复上线啦"
offline_tpl = "{{config.title}} \n😱 {{host.location}} {{host.name}} 主机已经掉线啦"
recovery_tpl = "{% for recovery in recoveries %}✅ {{host.name}} {{recovery.alert_type}} 已恢复，当前 {{recovery.value_percent | round}}%，恢复阈值 {{recovery.recover_threshold}}%{% endfor %}"
# custom 模板置空则停用自定义告警，只保留上下线通知
# 每个可独立收敛的分支使用 <!-- ss-alert:<rule_id> --> ... <!-- /ss-alert --> 标记。
custom_tpl = """
{% if alerts.memory_usage.enabled and host.memory_total > 0 and (host.memory_used * 100.0 / host.memory_total) >= alerts.memory_usage.threshold %}
<!-- ss-alert:memory_usage_high -->
<pre>😲 {{host.name}} 主机内存使用率超过 {{alerts.memory_usage.threshold}}%, 当前{{ (100 * host.memory_used / host.memory_total) | round }}%  </pre>
<!-- /ss-alert -->
{% endif %}

{% if alerts.disk_usage.enabled and host.hdd_total > 0 and (host.hdd_used * 100.0 / host.hdd_total) >= alerts.disk_usage.threshold %}
<!-- ss-alert:disk_usage_high -->
<pre>😲 {{host.name}} 主机硬盘使用率超过 {{alerts.disk_usage.threshold}}%, 当前{{ (100 * host.hdd_used / host.hdd_total) | round }}% </pre>
<!-- /ss-alert -->
{% endif %}
"""
###################### tgbot end ##########################

## 可选 单纯记录 event 到日志文件，调试自定义告警使用
[log]
enabled = false
log_dir = "/opt/ServerStatus/logs"
tpl = """{% set obj = dict(event=event, host=host, recoveries=recoveries, ip_info=ip_info, sys_info=sys_info) %} {{ obj | tojson}}"""

###################### log end ##########################

